  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
};
const fmt = (m) =>
  String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const parseTrip = (tr, n) =>
  Array.isArray(tr) ? { t: tr[0], s: tr[1], e: tr[2] } : { t: tr, s: 0, e: n - 1 };

/* Vreme polaska sa stajališta i, ili null ako ga taj polazak ne dodiruje. */

  if (i < trip.s || i > trip.e) return null;
  if (!dir.offsets) return i === 0 ? toMin(trip.t) : null;
  return toMin(trip.t) - dir.offsets[trip.s] + dir.offsets[i];
}

function RedVoznje() {
  const [now, setNow] = useState(new Date());
  const [lineId, setLineId] = useState("1");
  const [dirKey, setDirKey] = useState("a");
  const [day, setDay] = useState(dayKeyFor(new Date().getDay()));
  const [view, setView] = useState("sledeci");
  const [stopIdx, setStopIdx] = useState(0);
  const [showAll, setShowAll] = useState(false);

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(t);
  }, []);

  const line = LINES.find((l) => l.id === lineId);
  const dir = line.dirs.find((d) => d.key === dirKey) || line.dirs[0];
  const rawTrips = dir.trips[day] || [];
  const trips = useMemo(
    () => rawTrips.map((t) => parseTrip(t, dir.stops.length)),
    [rawTrips, dir]
  );

  const isToday = day === dayKeyFor(now.getDay());
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const idx = Math.min(stopIdx, dir.stops.length - 1);

  /* Polasci sa izabranog stajališta */
  const departures = useMemo(() => {
    const out = [];
    trips.forEach((tr, ti) => {
      const m = timeAt(tr, dir, idx);
      if (m !== null) out.push({ m, ti });
    });
    return out.sort((a, b) => a.m - b.m);
  }, [trips, dir, idx]);

  const nextPos = isToday ? departures.findIndex((d) => d.m >= nowMin) : -1;

  const visible = useMemo(() => {
    if (showAll || nextPos < 1) return departures;
    return departures.slice(Math.max(0, nextPos - 1));
  }, [departures, nextPos, showAll]);
  const hidden = departures.length - visible.length;

  const pickLine = (id) => {
    setLineId(id);
    setDirKey("a");
    setStopIdx(0);
    setShowAll(false);
  };
  const swapDir = () => {
    const other = line.dirs.find((d) => d.key !== dir.key);
    if (other) setDirKey(other.key);
    setStopIdx(0);
    setShowAll(false);
  };

  const dayWord =
    day === "subota" ? "subotom" : day === "nedelja" ? "nedeljom" : "radnim danima";
  const hasStopTimes = !!dir.offsets;

  const btn = (on) => ({
    flex: 1,
    borderRadius: 12,
    padding: "9px 0",
    fontSize: 12.5,
    fontWeight: 600,
    cursor: "pointer",
    background: on ? C.panel : C.bg,
    color: on ? C.ink : C.faint,
    border: "1px solid " + (on ? C.panel : C.line),
  });

  return (
    <div
      style={{
        fontFamily: "'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif",
        background: C.bg,
        color: C.ink,
        minHeight: "100vh",
        paddingBottom: 48,
      }}
    >
      <header style={{ padding: "22px 20px 14px" }}>
        <h1 style={{ margin: 0, fontSize: 24, fontWeight: 650, letterSpacing: "-0.01em" }}>
          Gradski prevoz Pazova
        </h1>
        <p style={{ margin: "4px 0 0", fontSize: 13, color: C.mid }}>
          Red vožnje na snazi od 1. septembra 2026. Prevoz je besplatan za sve putnike.
        </p>
      </header>

      {/* Linije */}
      <div
        style={{
          display: "grid",
          gridTemplateColumns: "repeat(8, 1fr)",
          gap: 6,
          padding: "0 20px 16px",
        }}
      >
        {LINES.map((l) => {
          const on = l.id === lineId;
          return (
            <button
              key={l.id}
              onClick={() => pickLine(l.id)}
              aria-pressed={on}
              aria-label={"Linija " + l.id}
              style={{
                width: "100%",
                aspectRatio: "1 / 1",
                maxWidth: 48,
                borderRadius: 999,
                padding: 0,
                border: on ? "none" : "1px solid " + C.line,
                background: on ? l.color : C.bg,
                color: on ? "#FFFFFF" : C.mid,
                fontSize: 16,
                fontWeight: 650,
                cursor: "pointer",
              }}
            >
              {l.id}
            </button>
          );
        })}
      </div>

      {/* Naziv linije */}
      <div style={{ padding: "0 20px" }}>
        <div
          style={{
            background: C.panelSoft,
            borderLeft: "4px solid " + line.color,
            borderRadius: 14,
            padding: 16,
          }}
        >
          <h2 style={{ margin: 0, fontSize: 17, fontWeight: 650, lineHeight: 1.35 }}>
            {line.title}
          </h2>
        </div>
      </div>

      {/* Smer */}
      {line.dirs.length > 1 && (
        <div style={{ padding: "16px 20px 0" }}>
          <button
            onClick={swapDir}
            aria-label="Promeni smer"
            style={{
              width: "100%",
              display: "flex",
              alignItems: "center",
              gap: 10,
              textAlign: "left",
              borderRadius: 12,
              padding: "10px 12px",
              cursor: "pointer",
              background: C.bg,
              border: "1px solid " + C.line,
            }}
          >
            <span style={{ flex: 1, minWidth: 0 }}>
              <span style={{ display: "block", fontSize: 11, color: C.faint }}>Polazak</span>
              <span style={{ display: "block", fontSize: 14, fontWeight: 650 }}>{dir.from}</span>
            </span>
            <span
              style={{
                flexShrink: 0,
                width: 34,
                height: 34,
                borderRadius: 999,
                background: line.color,
                color: "#FFFFFF",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
              }}
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M7 7h11l-3-3M17 17H6l3 3"
                  stroke="currentColor"
                  strokeWidth="2"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
              </svg>
            </span>
            <span style={{ flex: 1, minWidth: 0, textAlign: "right" }}>
              <span style={{ display: "block", fontSize: 11, color: C.faint }}>Dolazak</span>
              <span style={{ display: "block", fontSize: 14, fontWeight: 650 }}>{dir.to}</span>
            </span>
          </button>
        </div>
      )}

      {/* Dan */}
      <div style={{ display: "flex", gap: 8, padding: "10px 20px 0" }}>
        {DAYS.map((d) => {
          const on = d.key === day;
          return (
            <button
              key={d.key}
              onClick={() => {
                setDay(d.key);
                setShowAll(false);
              }}
              aria-pressed={on}
              style={{
                ...btn(false),
                background: on ? C.ink : C.bg,
                color: on ? "#FFFFFF" : C.mid,
                border: "1px solid " + (on ? C.ink : C.line),
                fontSize: 13,
                borderRadius: 12,
                padding: "10px 0",
              }}
            >
              {d.label}
            </button>
          );
        })}
      </div>

      {/* Prikaz */}
      <div style={{ display: "flex", gap: 8, padding: "10px 20px 0" }}>
        {VIEWS.map((v) => (
          <button
            key={v.key}
            onClick={() => setView(v.key)}
            aria-pressed={v.key === view}
            style={btn(v.key === view)}
          >
            {v.label}
          </button>
        ))}
      </div>

      {/* Stajalište */}
      {view !== "tabela" && hasStopTimes && (
        <div style={{ padding: "14px 20px 0" }}>
          <label
            style={{ display: "block", fontSize: 11, color: C.faint, marginBottom: 4 }}
            htmlFor="stajaliste"
          >
            Stajalište
          </label>
          <select
            id="stajaliste"
            value={idx}
            onChange={(e) => {
              setStopIdx(Number(e.target.value));
              setShowAll(false);
            }}
            style={{
              width: "100%",
              borderRadius: 12,
              padding: "10px 12px",
              fontSize: 14,
              fontWeight: 600,
              color: C.ink,
              background: C.bg,
              border: "1px solid " + C.line,
            }}
          >
            {dir.stops.map((st, i) => (
              <option key={i} value={i}>
                {i + 1}. {st}
              </option>
            ))}
          </select>
        </div>
      )}

      {/* Naredni polasci */}
      {view === "sledeci" && (
        <>
          <div style={{ padding: "18px 20px 0" }}>
            {departures.length === 0 ? (
              <p style={{ margin: 0, fontSize: 14, color: C.mid }}>
                Sa ovog stajališta nema polazaka {dayWord}.
              </p>
            ) : !isToday ? (
              <p style={{ margin: 0, fontSize: 13, color: C.faint }}>
                Prikazan je red vožnje za drugi dan, pa nema odbrojavanja.
              </p>
            ) : nextPos === -1 ? (
              <p style={{ margin: 0, fontSize: 14, color: C.mid }}>
                Danas više nema polazaka. Prvi sutra:{" "}
                <strong>{fmt(departures[0].m)}</strong>
              </p>
            ) : (
              <div style={{ display: "flex", alignItems: "baseline", gap: 12 }}>
                <span
                  style={{
                    fontSize: 40,
                    fontWeight: 680,
                    lineHeight: 1,
                    color: line.color,
                    fontVariantNumeric: "tabular-nums",
                  }}
                >
                  {fmt(departures[nextPos].m)}
                </span>
                <span style={{ fontSize: 14, color: C.mid }}>
                  za {departures[nextPos].m - nowMin} min
                </span>
              </div>
            )}
          </div>

          {departures.length > 0 && (
            <div style={{ padding: "18px 20px 0" }}>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8 }}>
                {visible.map((d, k) => {
                  const pos = departures.indexOf(d);
                  const isNext = pos === nextPos;
                  const past = isToday && nextPos !== -1 && pos < nextPos;
                  return (
                    <div
                      key={k}
                      style={{
                        borderRadius: 10,
                        padding: "10px 0",
                        textAlign: "center",
                        fontSize: 15,
                        fontWeight: 600,
                        fontVariantNumeric: "tabular-nums",
                        background: isNext ? line.color : C.panel,
                        color: isNext ? "#FFFFFF" : past ? C.faint : C.ink,
                      }}
                    >
                      {fmt(d.m)}
                    </div>
                  );
                })}
              </div>
              {hidden > 0 && (
                <button
                  onClick={() => setShowAll(true)}
                  style={{
                    marginTop: 12,
                    background: "none",
                    border: "none",
                    padding: 0,
                    fontSize: 13,
                    color: C.mid,
                    textDecoration: "underline",
                    textUnderlineOffset: 4,
                    cursor: "pointer",
                  }}
                >
                  Prikaži i ranije polaske ({hidden})
                </button>
              )}
            </div>
          )}
        </>
      )}

      {/* Ceo dan sa izabranog stajališta */}
      {view === "ceodan" && (
        <div style={{ padding: "18px 20px 0" }}>
          {departures.length === 0 ? (
            <p style={{ margin: 0, fontSize: 14, color: C.mid }}>
              Sa ovog stajališta nema polazaka {dayWord}.
            </p>
          ) : (
            (() => {
              const hours = Array.from(new Set(departures.map((d) => Math.floor(d.m / 60))));
              return (
                <div style={{ borderRadius: 14, overflow: "hidden", background: C.panelSoft }}>
                  {hours.map((h, hi) => (
                    <div
                      key={h}
                      style={{
                        display: "flex",
                        gap: 10,
                        alignItems: "flex-start",
                        padding: "6px 8px",
                        borderTop: hi ? "1px solid " + C.line : "none",
                      }}
                    >
                      <div
                        style={{
                          width: 34,
                          flexShrink: 0,
                          textAlign: "center",
                          padding: "6px 0",
                          fontSize: 15,
                          fontWeight: 700,
                          color: line.color,
                          fontVariantNumeric: "tabular-nums",
                        }}
                      >
                        {String(h).padStart(2, "0")}
                      </div>
                      <div style={{ flex: 1, display: "flex", flexWrap: "wrap", gap: 4 }}>
                        {departures.map((d, pos) => {
                          if (Math.floor(d.m / 60) !== h) return null;
                          const isNext = pos === nextPos;
                          const past = isToday && nextPos !== -1 && pos < nextPos;
                          return (
                            <span
                              key={pos}
                              style={{
                                borderRadius: 6,
                                padding: "5px 7px",
                                fontSize: 14,
                                fontWeight: 600,
                                fontVariantNumeric: "tabular-nums",
                                background: isNext ? line.color : C.panel,
                                color: isNext ? "#FFFFFF" : past ? C.faint : C.ink,
                              }}
                            >
                              {String(d.m % 60).padStart(2, "0")}
                            </span>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              );
            })()
          )}
        </div>
      )}

      {/* Tabela stajališta x polasci */}
      {view === "tabela" && (
        <div style={{ padding: "18px 0 0" }}>
          {trips.length === 0 ? (
            <p style={{ margin: 0, padding: "0 20px", fontSize: 14, color: C.mid }}>
              Ova linija ne saobraća {dayWord}.
            </p>
          ) : !hasStopTimes ? (
            <p style={{ margin: 0, padding: "0 20px", fontSize: 14, color: C.mid }}>
              Za ovu liniju nemam vremena po stajalištima, samo polaske sa prve stanice.
            </p>
          ) : (
            <div style={{ overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
              <table
                style={{
                  borderCollapse: "collapse",
                  fontVariantNumeric: "tabular-nums",
                  fontSize: 12,
                }}
              >
                <tbody>
                  {dir.stops.map((st, i) => (
                    <tr key={i}>
                      <th
                        scope="row"
                        style={{
                          position: "sticky",
                          left: 0,
                          zIndex: 1,
                          background: C.bg,
                          textAlign: "left",
                          fontWeight: i === 0 || i === dir.stops.length - 1 ? 700 : 500,
                          color: i === 0 || i === dir.stops.length - 1 ? C.ink : C.mid,
                          fontSize: 11.5,
                          padding: "6px 10px 6px 20px",
                          borderRight: "2px solid " + C.line,
                          borderBottom: "1px solid " + C.line,
                          minWidth: 132,
                          maxWidth: 132,
                          lineHeight: 1.25,
                        }}
                      >
                        {st}
                      </th>
                      {trips.map((tr, ti) => {
                        const m = timeAt(tr, dir, i);
                        const isNext =
                          nextPos !== -1 && departures[nextPos] && departures[nextPos].ti === ti;
                        return (
                          <td
                            key={ti}
                            style={{
                              padding: "6px 8px",
                              textAlign: "center",
                              minWidth: 46,
                              borderBottom: "1px solid " + C.line,
                              background: isNext ? line.color + "1A" : "transparent",
                              color: m === null ? C.faint : isNext ? line.color : C.ink,
                              fontWeight: isNext ? 700 : 500,
                            }}
                          >
                            {m === null ? "–" : fmt(m)}
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          <p style={{ padding: "10px 20px 0", margin: 0, fontSize: 12, color: C.faint }}>
            Tabela se pomera levo-desno. Crtica znači da polazak ne dodiruje to stajalište.
          </p>
        </div>
      )}

      {/* Napomene */}
      {line.notes.length > 0 && (
        <div style={{ padding: "26px 20px 0" }}>
          <ul style={{ margin: 0, padding: 0, listStyle: "none" }}>
            {line.notes.map((n, i) => (
              <li
                key={i}
                style={{ fontSize: 12.5, lineHeight: 1.6, color: C.mid, marginTop: i ? 8 : 0 }}
              >
                {n}
              </li>
            ))}
          </ul>
        </div>
      )}

      <p style={{ padding: "26px 20px 0", margin: 0, fontSize: 11.5, lineHeight: 1.6, color: C.faint }}>
        Prevoznik: ASP „Strela“ Obrenovac, red vožnje upisan 28.08.2026. Vremena su planirana i
        mogu da odstupaju od stvarnih dolazaka. Call centar:{" "}
        <a
          href="tel:+38122311617"
          style={{ color: C.mid, fontWeight: 600, textDecoration: "underline", textUnderlineOffset: 3 }}
        >
          022/311-617
        </a>
      </p>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("app")).render(<RedVoznje />);
</script>
</body>
</html>
