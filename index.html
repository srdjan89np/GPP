<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gradski prevoz Pazova</title>
<meta name="description" content="Red vožnje gradskog i prigradskog prevoza opštine Stara Pazova, sa vremenima po stajalištima. Radi bez interneta." />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)" />
<style>
:root {
  --bg: #ffffff;
  --panel: #f1f2f5;
  --panel-soft: #f7f8fa;
  --line: #e1e3e9;
  --ink: #15171c;
  --mid: #5a6070;
  --faint: #9aa0ae;
  --accent: #d8452f;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
}

body {
  font-family: "Inter", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

#app {
  max-width: 640px;
  margin: 0 auto;
  padding-top: var(--safe-top);
  padding-bottom: calc(40px + var(--safe-bottom));
}

button, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* Zaglavlje */
.head { padding: 22px 20px 14px; }
.head h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.01em; }
.head p { margin: 4px 0 0; font-size: 13px; line-height: 1.5; color: var(--mid); }

/* Izbor linije */
.lines {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 6px;
  padding: 0 20px 16px;
}
.line-btn {
  width: 100%;
  aspect-ratio: 1 / 1;
  max-width: 48px;
  border-radius: 999px;
  padding: 0;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--mid);
  font-size: 16px;
  font-weight: 650;
}
.line-btn[aria-pressed="true"] {
  border-color: transparent;
  background: var(--accent);
  color: #fff;
}

/* Naziv linije */
.title-card {
  margin: 0 20px;
  background: var(--panel-soft);
  border-left: 4px solid var(--accent);
  border-radius: 14px;
  padding: 16px;
}
.title-card h2 { margin: 0; font-size: 17px; font-weight: 650; line-height: 1.35; }

/* Smer */
.dir-wrap { padding: 16px 20px 0; }
.dir-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  border-radius: 12px;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--line);
}
.dir-btn .col { flex: 1; min-width: 0; }
.dir-btn .col.right { text-align: right; }
.dir-btn .lbl { display: block; font-size: 11px; color: var(--faint); }
.dir-btn .val { display: block; font-size: 14px; font-weight: 650; }
.dir-btn .swap {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Trake dugmadi */
.row { display: flex; gap: 8px; padding: 10px 20px 0; }
.tab {
  flex: 1;
  border-radius: 12px;
  padding: 10px 0;
  font-size: 13px;
  font-weight: 600;
  background: var(--bg);
  color: var(--mid);
  border: 1px solid var(--line);
}
.tab[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.row.views .tab { font-size: 12.5px; padding: 9px 0; color: var(--faint); }
.row.views .tab[aria-pressed="true"] {
  background: var(--panel);
  color: var(--ink);
  border-color: var(--panel);
}

/* Stajalište */
.stop-wrap { padding: 14px 20px 0; }
.stop-wrap label { display: block; font-size: 11px; color: var(--faint); margin-bottom: 4px; }
.stop-wrap select {
  width: 100%;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 14px;
  font-weight: 600;
  background: var(--bg);
  border: 1px solid var(--line);
}

/* Sledeći polazak */
.next { padding: 18px 20px 0; }
.next .big {
  font-size: 40px;
  font-weight: 680;
  line-height: 1;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.next .in { font-size: 14px; color: var(--mid); margin-left: 12px; }
.msg { margin: 0; font-size: 14px; line-height: 1.5; color: var(--mid); }
.msg.small { font-size: 13px; color: var(--faint); }

/* Mreža polazaka */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 18px 20px 0;
}
.slot {
  border-radius: 10px;
  padding: 10px 0;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  background: var(--panel);
}
.slot.next { background: var(--accent); color: #fff; }
.slot.past { color: var(--faint); }

.link-btn {
  margin: 12px 20px 0;
  background: none;
  border: none;
  padding: 0;
  font-size: 13px;
  color: var(--mid);
  text-decoration: underline;
  text-underline-offset: 4px;
}

/* Ceo dan */
.hours { margin: 18px 20px 0; border-radius: 14px; overflow: hidden; background: var(--panel-soft); }
.hour-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 8px; }
.hour-row + .hour-row { border-top: 1px solid var(--line); }
.hour-key {
  width: 34px;
  flex-shrink: 0;
  text-align: center;
  padding: 6px 0;
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.mins { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; }
.min {
  border-radius: 6px;
  padding: 5px 7px;
  font-size: 14px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  background: var(--panel);
}
.min.next { background: var(--accent); color: #fff; }
.min.past { color: var(--faint); }

/* Tabela */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 18px; }
table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
th.stop {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--bg);
  text-align: left;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--mid);
  padding: 6px 10px 6px 20px;
  border-right: 2px solid var(--line);
  border-bottom: 1px solid var(--line);
  min-width: 134px;
  max-width: 134px;
  line-height: 1.25;
}
th.stop.end { font-weight: 700; color: var(--ink); }
td {
  padding: 6px 8px;
  text-align: center;
  min-width: 46px;
  border-bottom: 1px solid var(--line);
  font-weight: 500;
}
td.skip { color: var(--faint); }
td.now { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); font-weight: 700; }

/* Napomene i podnožje */
.notes { padding: 26px 20px 0; margin: 0; list-style: none; }
.notes li { font-size: 12.5px; line-height: 1.6; color: var(--mid); }
.notes li + li { margin-top: 8px; }
.foot { padding: 26px 20px 0; margin: 0; font-size: 11.5px; line-height: 1.6; color: var(--faint); }
.foot a { color: var(--mid); font-weight: 600; text-underline-offset: 3px; }
.hint { padding: 10px 20px 0; margin: 0; font-size: 12px; color: var(--faint); }

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12141a;
    --panel: #21242d;
    --panel-soft: #1a1d24;
    --line: #2b2f3a;
    --ink: #eceef3;
    --mid: #a2a9b8;
    --faint: #6d7486;
  }
  .line-btn[aria-pressed="true"], .slot.next, .min.next, .dir-btn .swap { color: #fff; }
  .tab[aria-pressed="true"] { background: var(--ink); color: #12141a; }
}
</style>

    dirs: [

          subota: ["07:35","11:15","12:35","14:10","15:20","17:50"],
          nedelja: ["07:30","11:15","13:35","16:20"],

];

/* Gradski prevoz Pazova — prikaz reda vožnje. Bez spoljnih biblioteka. */
(function () {
  "use strict";

  var DAYS = [
    { key: "radni", label: "Radni dan", word: "radnim danima" },
    { key: "subota", label: "Subota", word: "subotom" },
    { key: "nedelja", label: "Nedelja", word: "nedeljom" }
  ];

  var VIEWS = [
    { key: "sledeci", label: "Naredni" },
    { key: "ceodan", label: "Ceo dan" },
    { key: "tabela", label: "Tabela" }
  ];

  /* ---------- pomoćne ---------- */

  function toMin(t) {
    var p = t.split(":");
    return (+p[0]) * 60 + (+p[1]);
  }
  function fmt(m) {
    var h = Math.floor(m / 60), mm = m % 60;
    return (h < 10 ? "0" : "") + h + ":" + (mm < 10 ? "0" : "") + mm;
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function parseTrip(tr, n) {
    return Array.isArray(tr)
      ? { t: tr[0], s: tr[1], e: tr[2] }
      : { t: tr, s: 0, e: n - 1 };
  }

  /* Vreme polaska sa stajališta i, ili null ako ga taj polazak ne dodiruje. */
  function timeAt(trip, dir, i) {
    if (i < trip.s || i > trip.e) return null;
    if (!dir.offsets) return i === 0 ? toMin(trip.t) : null;
    return toMin(trip.t) - dir.offsets[trip.s] + dir.offsets[i];
  }

  function dayKeyFor(d) { return d === 0 ? "nedelja" : d === 6 ? "subota" : "radni"; }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- stanje ---------- */

  var saved = {};
  try { saved = JSON.parse(localStorage.getItem("gpp") || "{}"); } catch (e) { saved = {}; }

  var state = {
    lineId: saved.lineId && LINES.some(function (l) { return l.id === saved.lineId; }) ? saved.lineId : "1",
    dirKey: saved.dirKey === "b" ? "b" : "a",
    stopIdx: typeof saved.stopIdx === "number" ? saved.stopIdx : 0,
    day: dayKeyFor(new Date().getDay()),
    view: "sledeci",
    showAll: false
  };

  function save() {
    try {
      localStorage.setItem("gpp", JSON.stringify({
        lineId: state.lineId, dirKey: state.dirKey, stopIdx: state.stopIdx
      }));
    } catch (e) { /* privatni režim — nije bitno */ }
  }

  function currentLine() {
    return LINES.filter(function (l) { return l.id === state.lineId; })[0];
  }
  function currentDir(line) {
    var d = line.dirs.filter(function (x) { return x.key === state.dirKey; })[0];
    return d || line.dirs[0];
  }

  /* ---------- render ---------- */

  var root = document.getElementById("app");

  function render() {
    var line = currentLine();
    var dir = currentDir(line);
    var dayDef = DAYS.filter(function (d) { return d.key === state.day; })[0];
    var rawTrips = dir.trips[state.day] || [];
    var trips = rawTrips.map(function (t) { return parseTrip(t, dir.stops.length); });

    if (state.stopIdx > dir.stops.length - 1) state.stopIdx = 0;
    var idx = state.stopIdx;

    var now = new Date();
    var isToday = state.day === dayKeyFor(now.getDay());
    var nowMin = now.getHours() * 60 + now.getMinutes();

    document.documentElement.style.setProperty("--accent", line.color);

    var departures = [];
    trips.forEach(function (tr, ti) {
      var m = timeAt(tr, dir, idx);
      if (m !== null) departures.push({ m: m, ti: ti });
    });
    departures.sort(function (a, b) { return a.m - b.m; });

    var nextPos = -1;
    if (isToday) {
      for (var i = 0; i < departures.length; i++) {
        if (departures[i].m >= nowMin) { nextPos = i; break; }
      }
    }

    root.innerHTML = "";

    /* zaglavlje */
    var head = el("header", "head");
    head.appendChild(el("h1", null, "Gradski prevoz Pazova"));
    head.appendChild(el("p", null,
      "Red vožnje na snazi od 1. septembra 2026. Prevoz je besplatan za sve putnike."));
    root.appendChild(head);

    /* linije */
    var lines = el("div", "lines");
    LINES.forEach(function (l) {
      var b = el("button", "line-btn", l.id);
      b.setAttribute("aria-pressed", l.id === state.lineId ? "true" : "false");
      b.setAttribute("aria-label", "Linija " + l.id);
      if (l.id === state.lineId) b.style.background = l.color;
      b.onclick = function () {
        state.lineId = l.id;
        state.dirKey = "a";
        state.stopIdx = 0;
        state.showAll = false;
        save();
        render();
      };
      lines.appendChild(b);
    });
    root.appendChild(lines);

    /* naziv */
    var card = el("div", "title-card");
    card.style.borderLeftColor = line.color;
    card.appendChild(el("h2", null, line.title));
    root.appendChild(card);

    /* smer */
    if (line.dirs.length > 1) {
      var dw = el("div", "dir-wrap");
      var db = el("button", "dir-btn");
      db.setAttribute("aria-label", "Promeni smer");

      var c1 = el("span", "col");
      c1.appendChild(el("span", "lbl", "Polazak"));
      c1.appendChild(el("span", "val", dir.from));

      var sw = el("span", "swap");
      sw.style.background = line.color;
      sw.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
        '<path d="M7 7h11l-3-3M17 17H6l3 3" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round"/></svg>';

      var c2 = el("span", "col right");
      c2.appendChild(el("span", "lbl", "Dolazak"));
      c2.appendChild(el("span", "val", dir.to));

      db.appendChild(c1); db.appendChild(sw); db.appendChild(c2);
      db.onclick = function () {
        var other = line.dirs.filter(function (x) { return x.key !== dir.key; })[0];
        if (other) state.dirKey = other.key;
        state.stopIdx = 0;
        state.showAll = false;
        save();
        render();
      };
      dw.appendChild(db);
      root.appendChild(dw);
    }

    /* dan */
    var rowDay = el("div", "row");
    DAYS.forEach(function (d) {
      var b = el("button", "tab", d.label);
      b.setAttribute("aria-pressed", d.key === state.day ? "true" : "false");
      b.onclick = function () { state.day = d.key; state.showAll = false; render(); };
      rowDay.appendChild(b);
    });
    root.appendChild(rowDay);

    /* prikaz */
    var rowView = el("div", "row views");
    VIEWS.forEach(function (v) {
      var b = el("button", "tab", v.label);
      b.setAttribute("aria-pressed", v.key === state.view ? "true" : "false");
      b.onclick = function () { state.view = v.key; render(); };
      rowView.appendChild(b);
    });
    root.appendChild(rowView);

    /* stajalište */
    if (state.view !== "tabela" && dir.offsets) {
      var sws = el("div", "stop-wrap");
      var lab = el("label", null, "Stajalište");
      lab.setAttribute("for", "stajaliste");
      var sel = el("select");
      sel.id = "stajaliste";
      dir.stops.forEach(function (st, i) {
        var o = el("option", null, (i + 1) + ". " + st);
        o.value = String(i);
        if (i === idx) o.selected = true;
        sel.appendChild(o);
      });
      sel.onchange = function () {
        state.stopIdx = +sel.value;
        state.showAll = false;
        save();
        render();
      };
      sws.appendChild(lab);
      sws.appendChild(sel);
      root.appendChild(sws);
    }

    if (state.view === "sledeci") renderNext(line, departures, nextPos, isToday, nowMin, dayDef);
    else if (state.view === "ceodan") renderDay(line, departures, nextPos, isToday, dayDef);
    else renderTable(line, dir, trips, departures, nextPos, dayDef);

    /* napomene */
    if (line.notes && line.notes.length) {
      var ul = el("ul", "notes");
      line.notes.forEach(function (n) { ul.appendChild(el("li", null, n)); });
      root.appendChild(ul);
    }

    var foot = el("p", "foot");
    foot.appendChild(document.createTextNode(
      "Prevoznik: ASP „Strela“ Obrenovac, red vožnje upisan 28.08.2026. " +
      "Vremena su planirana i mogu da odstupaju od stvarnih dolazaka. Call centar: "));
    var a = el("a", null, "022/311-617");
    a.href = "tel:+38122311617";
    foot.appendChild(a);
    root.appendChild(foot);
  }

  function renderNext(line, departures, nextPos, isToday, nowMin, dayDef) {
    var box = el("div", "next");
    if (!departures.length) {
      box.appendChild(el("p", "msg", "Sa ovog stajališta nema polazaka " + dayDef.word + "."));
    } else if (!isToday) {
      box.appendChild(el("p", "msg small", "Prikazan je red vožnje za drugi dan, pa nema odbrojavanja."));
    } else if (nextPos === -1) {
      box.appendChild(el("p", "msg",
        "Danas više nema polazaka. Prvi sledećeg dana: " + fmt(departures[0].m)));
    } else {
      var wrap = el("div");
      var big = el("span", "big", fmt(departures[nextPos].m));
      big.style.color = line.color;
      var mins = departures[nextPos].m - nowMin;
      wrap.appendChild(big);
      wrap.appendChild(el("span", "in", mins === 0 ? "kreće sada" : "za " + mins + " min"));
      box.appendChild(wrap);
    }
    root.appendChild(box);

    if (!departures.length) return;

    var start = (state.showAll || nextPos < 1) ? 0 : nextPos - 1;
    var grid = el("div", "grid");
    departures.slice(start).forEach(function (d, k) {
      var pos = start + k;
      var cls = "slot";
      if (pos === nextPos) cls += " next";
      else if (isToday && nextPos !== -1 && pos < nextPos) cls += " past";
      var s = el("div", cls, fmt(d.m));
      if (pos === nextPos) s.style.background = line.color;
      grid.appendChild(s);
    });
    root.appendChild(grid);

    if (start > 0) {
      var b = el("button", "link-btn", "Prikaži i ranije polaske (" + start + ")");
      b.onclick = function () { state.showAll = true; render(); };
      root.appendChild(b);
    }
  }

  function renderDay(line, departures, nextPos, isToday, dayDef) {
    if (!departures.length) {
      var p = el("p", "msg");
      p.style.padding = "18px 20px 0";
      p.textContent = "Sa ovog stajališta nema polazaka " + dayDef.word + ".";
      root.appendChild(p);
      return;
    }
    var hours = [];
    departures.forEach(function (d) {
      var h = Math.floor(d.m / 60);
      if (hours.indexOf(h) === -1) hours.push(h);
    });

    var box = el("div", "hours");
    hours.forEach(function (h) {
      var row = el("div", "hour-row");
      var key = el("div", "hour-key", pad2(h));
      key.style.color = line.color;
      row.appendChild(key);
      var mins = el("div", "mins");
      departures.forEach(function (d, pos) {
        if (Math.floor(d.m / 60) !== h) return;
        var cls = "min";
        if (pos === nextPos) cls += " next";
        else if (isToday && nextPos !== -1 && pos < nextPos) cls += " past";
        var s = el("span", cls, pad2(d.m % 60));
        if (pos === nextPos) s.style.background = line.color;
        mins.appendChild(s);
      });
      row.appendChild(mins);
      box.appendChild(row);
    });
    root.appendChild(box);
  }

  function renderTable(line, dir, trips, departures, nextPos, dayDef) {
    if (!trips.length) {
      var p = el("p", "msg");
      p.style.padding = "18px 20px 0";
      p.textContent = "Ova linija ne saobraća " + dayDef.word + ".";
      root.appendChild(p);
      return;
    }
    var activeTrip = nextPos !== -1 && departures[nextPos] ? departures[nextPos].ti : -1;

    var scroll = el("div", "table-scroll");
    var table = el("table");
    var tbody = el("tbody");

    dir.stops.forEach(function (st, i) {
      var tr = el("tr");
      var isEnd = i === 0 || i === dir.stops.length - 1;
      var th = el("th", "stop" + (isEnd ? " end" : ""), st);
      th.setAttribute("scope", "row");
      tr.appendChild(th);
      trips.forEach(function (t, ti) {
        var m = timeAt(t, dir, i);
        var td = el("td", m === null ? "skip" : (ti === activeTrip ? "now" : ""), m === null ? "–" : fmt(m));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    scroll.appendChild(table);
    root.appendChild(scroll);
    root.appendChild(el("p", "hint",
      "Tabela se pomera levo-desno. Crtica znači da polazak ne dodiruje to stajalište."));
  }

  /* ---------- pokretanje ---------- */

  render();

  // Osveži tek kad se promeni minut, i ne dok korisnik čita tabelu,
  // da se prikaz ne pomera pod prstima.
  var lastMin = new Date().getMinutes();
  setInterval(function () {
    var m = new Date().getMinutes();
    if (m === lastMin) return;
    lastMin = m;
    if (state.view === "tabela") return;
    render();
  }, 10000);

  // Povratak u prvi plan: dan je možda prešao u sledeći.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    state.day = dayKeyFor(new Date().getDay());
    state.showAll = false;
    lastMin = new Date().getMinutes();
    render();
  });

  // Service worker samo na vebu. U Android aplikaciji su fajlovi već u paketu,
  // pa bi keš iz starije verzije mogao da zadrži zastareo red vožnje.
  var uAndroid = location.hostname === "appassets.androidplatform.net";
  if (!uAndroid && "serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* nebitno */ });
    });
  }
})();
</script>
