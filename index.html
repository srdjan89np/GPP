<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gradski prevoz Pazova</title>
<meta name="description" content="Red vožnje gradskog i prigradskog prevoza opštine Stara Pazova, sa vremenima po stajalištima. Radi bez interneta." />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)" />
<style>
:root {
  --bg: #ffffff;
  --panel: #f1f2f5;
  --panel-soft: #f7f8fa;
  --line: #e1e3e9;
  --ink: #15171c;
  --mid: #5a6070;
  --faint: #9aa0ae;
  --accent: #d8452f;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
}

body {
  font-family: "Inter", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

#app {
  max-width: 640px;
  margin: 0 auto;
  padding-top: var(--safe-top);
  padding-bottom: calc(40px + var(--safe-bottom));
}

button, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* Zaglavlje */
.head { padding: 22px 20px 14px; }
.head h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.01em; }
.head p { margin: 4px 0 0; font-size: 13px; line-height: 1.5; color: var(--mid); }

/* Izbor linije */
.lines {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 6px;
  padding: 0 20px 16px;
}
.line-btn {
  width: 100%;
  aspect-ratio: 1 / 1;
  max-width: 48px;
  border-radius: 999px;
  padding: 0;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--mid);
  font-size: 16px;
  font-weight: 650;
}
.line-btn[aria-pressed="true"] {
  border-color: transparent;
  background: var(--accent);
  color: #fff;
}

/* Naziv linije */
.title-card {
  margin: 0 20px;
  background: var(--panel-soft);
  border-left: 4px solid var(--accent);
  border-radius: 14px;
  padding: 16px;
}
.title-card h2 { margin: 0; font-size: 17px; font-weight: 650; line-height: 1.35; }

/* Smer */
.dir-wrap { padding: 16px 20px 0; }
.dir-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  border-radius: 12px;
  padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--line);
}
.dir-btn .col { flex: 1; min-width: 0; }
.dir-btn .col.right { text-align: right; }
.dir-btn .lbl { display: block; font-size: 11px; color: var(--faint); }
.dir-btn .val { display: block; font-size: 14px; font-weight: 650; }
.dir-btn .swap {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Trake dugmadi */
.row { display: flex; gap: 8px; padding: 10px 20px 0; }
.tab {
  flex: 1;
  border-radius: 12px;
  padding: 10px 0;
  font-size: 13px;
  font-weight: 600;
  background: var(--bg);
  color: var(--mid);
  border: 1px solid var(--line);
}
.tab[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.row.views .tab { font-size: 12.5px; padding: 9px 0; color: var(--faint); }
.row.views .tab[aria-pressed="true"] {
  background: var(--panel);
  color: var(--ink);
  border-color: var(--panel);
}

/* Stajalište */
.stop-wrap { padding: 14px 20px 0; }
.stop-wrap label { display: block; font-size: 11px; color: var(--faint); margin-bottom: 4px; }
.stop-wrap select {
  width: 100%;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 14px;
  font-weight: 600;
  background: var(--bg);
  border: 1px solid var(--line);
}

/* Sledeći polazak */
.next { padding: 18px 20px 0; }
.next .big {
  font-size: 40px;
  font-weight: 680;
  line-height: 1;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.next .in { font-size: 14px; color: var(--mid); margin-left: 12px; }
.msg { margin: 0; font-size: 14px; line-height: 1.5; color: var(--mid); }
.msg.small { font-size: 13px; color: var(--faint); }

/* Mreža polazaka */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 18px 20px 0;
}
.slot {
  border-radius: 10px;
  padding: 10px 0;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  background: var(--panel);
}
.slot.next { background: var(--accent); color: #fff; }
.slot.past { color: var(--faint); }

.link-btn {
  margin: 12px 20px 0;
  background: none;
  border: none;
  padding: 0;
  font-size: 13px;
  color: var(--mid);
  text-decoration: underline;
  text-underline-offset: 4px;
}

/* Ceo dan */
.hours { margin: 18px 20px 0; border-radius: 14px; overflow: hidden; background: var(--panel-soft); }
.hour-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 8px; }
.hour-row + .hour-row { border-top: 1px solid var(--line); }
.hour-key {
  width: 34px;
  flex-shrink: 0;
  text-align: center;
  padding: 6px 0;
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.mins { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; }
.min {
  border-radius: 6px;
  padding: 5px 7px;
  font-size: 14px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  background: var(--panel);
}
.min.next { background: var(--accent); color: #fff; }
.min.past { color: var(--faint); }

/* Tabela */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 18px; }
table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
th.stop {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--bg);
  text-align: left;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--mid);
  padding: 6px 10px 6px 20px;
  border-right: 2px solid var(--line);
  border-bottom: 1px solid var(--line);
  min-width: 134px;
  max-width: 134px;
  line-height: 1.25;
}
th.stop.end { font-weight: 700; color: var(--ink); }
td {
  padding: 6px 8px;
  text-align: center;
  min-width: 46px;
  border-bottom: 1px solid var(--line);
  font-weight: 500;
}
td.skip { color: var(--faint); }
td.now { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); font-weight: 700; }

/* Napomene i podnožje */
.notes { padding: 26px 20px 0; margin: 0; list-style: none; }
.notes li { font-size: 12.5px; line-height: 1.6; color: var(--mid); }
.notes li + li { margin-top: 8px; }
.foot { padding: 26px 20px 0; margin: 0; font-size: 11.5px; line-height: 1.6; color: var(--faint); }
.foot a { color: var(--mid); font-weight: 600; text-underline-offset: 3px; }
.hint { padding: 10px 20px 0; margin: 0; font-size: 12px; color: var(--faint); }

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12141a;
    --panel: #21242d;
    --panel-soft: #1a1d24;
    --line: #2b2f3a;
    --ink: #eceef3;
    --mid: #a2a9b8;
    --faint: #6d7486;
  }
  .line-btn[aria-pressed="true"], .slot.next, .min.next, .dir-btn .swap { color: #fff; }
  .tab[aria-pressed="true"] { background: var(--ink); color: #12141a; }
}

/* ---------- Podsetnici (samo u Android aplikaciji) ---------- */

button.slot, button.min {
  border: none;
  font: inherit;
  cursor: pointer;
}
button.slot { width: 100%; }

/* Tačka u uglu označava da je podsetnik uključen */
.slot.podsetnik, .min.podsetnik { position: relative; }
.slot.podsetnik::after, .min.podsetnik::after {
  content: "";
  position: absolute;
  top: 4px;
  right: 4px;
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--panel);
}
.slot.next.podsetnik::after, .min.next.podsetnik::after {
  background: #fff;
  box-shadow: none;
}

.poruka {
  margin: 14px 20px 0;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--panel-soft);
  border-left: 3px solid var(--accent);
  font-size: 13px;
  line-height: 1.5;
  color: var(--mid);
}

.upozorenje {
  margin: 14px 20px 0;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--panel-soft);
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--mid);
}
.link-ugradjen {
  margin-left: 6px;
  background: none;
  border: none;
  padding: 0;
  font-size: 12.5px;
  font-weight: 650;
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.podsetnici { padding: 26px 20px 0; }
.podsetnici h3 {
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 650;
  color: var(--mid);
}
.podsetnik-red {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--panel-soft);
}
.podsetnik-red + .podsetnik-red { margin-top: 6px; }
.pod-levo { flex: 1; min-width: 0; }
.pod-vreme {
  display: block;
  font-size: 16px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
.pod-opis {
  display: block;
  font-size: 12px;
  line-height: 1.4;
  color: var(--mid);
  margin-top: 1px;
}
.pod-otkazi {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--mid);
  font-size: 18px;
  line-height: 1;
}
.pod-nota {
  margin: 8px 0 0;
  font-size: 11.5px;
  color: var(--faint);
}

/* Objašnjenje podsetnika — stoji do prvog korišćenja */
.savet {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 18px 20px 0;
  padding: 12px 12px 12px 14px;
  border-radius: 14px;
  background: var(--panel-soft);
  border-left: 3px solid var(--accent);
}
.savet-ikona {
  flex-shrink: 0;
  margin-top: 1px;
  color: var(--accent);
  display: flex;
}
.savet-tekst { flex: 1; min-width: 0; }
.savet-tekst strong {
  display: block;
  font-size: 13.5px;
  font-weight: 650;
  color: var(--ink);
}
.savet-tekst p {
  margin: 4px 0 0;
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--mid);
}
.savet-zatvori {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  margin: -2px -2px 0 0;
  border: none;
  border-radius: 999px;
  background: none;
  color: var(--faint);
  font-size: 18px;
  line-height: 1;
}
</style>
</head>

/* Gradski prevoz Pazova — prikaz reda vožnje. Bez spoljnih biblioteka. */
(function () {
  "use strict";

  var DAYS = [
    { key: "radni", label: "Radni dan", word: "radnim danima" },
    { key: "subota", label: "Subota", word: "subotom" },
    { key: "nedelja", label: "Nedelja", word: "nedeljom" }
  ];

  var VIEWS = [
    { key: "sledeci", label: "Naredni" },
    { key: "ceodan", label: "Ceo dan" },
    { key: "tabela", label: "Tabela" }
  ];

  /* ---------- pomoćne ---------- */

  function toMin(t) {
    var p = t.split(":");
    return (+p[0]) * 60 + (+p[1]);
  }
  function fmt(m) {
    var h = Math.floor(m / 60), mm = m % 60;
    return (h < 10 ? "0" : "") + h + ":" + (mm < 10 ? "0" : "") + mm;
  }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function parseTrip(tr, n) {
    return Array.isArray(tr)
      ? { t: tr[0], s: tr[1], e: tr[2] }
      : { t: tr, s: 0, e: n - 1 };
  }

  /* Vreme polaska sa stajališta i, ili null ako ga taj polazak ne dodiruje. */
  function timeAt(trip, dir, i) {
    if (i < trip.s || i > trip.e) return null;
    if (!dir.offsets) return i === 0 ? toMin(trip.t) : null;
    return toMin(trip.t) - dir.offsets[trip.s] + dir.offsets[i];
  }

  function dayKeyFor(d) { return d === 0 ? "nedelja" : d === 6 ? "subota" : "radni"; }

  /* Podrazumevano stajalište: ono kroz koje prolazi najviše polazaka.
     Na kružnim linijama prva stanica u tabeli ume da ima samo jedan polazak
     dnevno, pa bi korisnik na otvaranju video prazan ekran. */
  function defaultStop(dir, day) {
    var trips = (dir.trips[day] || []).map(function (t) { return parseTrip(t, dir.stops.length); });
    var best = 0, bestN = -1;
    for (var i = 0; i < dir.stops.length; i++) {
      var n = 0;
      for (var k = 0; k < trips.length; k++) if (timeAt(trips[k], dir, i) !== null) n++;
      if (n > bestN) { bestN = n; best = i; }
    }
    return best;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;

  /* ---------- podsetnici (samo u Android aplikaciji) ---------- */

  var MOST = (function () {
    try {
      return (window.Prevoz && window.Prevoz.postoji()) ? window.Prevoz : null;
    } catch (e) {
      return null;
    }
  })();

  var MINUTA_PRE = [30, 10];

  function podsetnikId(line, dir, day, idx, m) {
    return line.id + "|" + dir.key + "|" + day + "|" + idx + "|" + fmt(m);
  }

  /** Prvi sledeći datum kada taj polazak stvarno kreće. */
  function sledeciPut(day, m) {
    var sada = new Date();
    for (var d = 0; d < 14; d++) {
      var t = new Date(sada.getFullYear(), sada.getMonth(), sada.getDate() + d,
                       Math.floor(m / 60), m % 60, 0, 0);
      if (t.getTime() <= sada.getTime() + 60000) continue;
      if (dayKeyFor(t.getDay()) !== day) continue;
      return t;
    }
    return null;
  }

  function ucitajPodsetnike() {
    if (!MOST) return [];

  }

  function opisDatuma(t) {
    var sada = new Date();
    var danas = new Date(sada.getFullYear(), sada.getMonth(), sada.getDate());
    var dan = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    var razlika = Math.round((dan - danas) / 86400000);
    if (razlika === 0) return "danas";
    if (razlika === 1) return "sutra";
    var imena = ["u nedelju", "u ponedeljak", "u utorak", "u sredu",
                 "u četvrtak", "u petak", "u subotu"];
    return imena[t.getDay()];
  }

  /** Uključuje ili isključuje podsetnik za jedan polazak. */

    var id = podsetnikId(line, dir, day, idx, m);

    if (imaPodsetnik(id)) {

      state.podsetnici = ucitajPodsetnike();
      render();
      return;
    }

    if (!MOST.imaDozvolu()) {
      state.cekaDozvolu = { line: line.id, dir: dir.key, day: day, idx: idx, m: m };
      MOST.zatraziDozvolu();

    }

    var naslov = "Linija " + line.id + " → " + dir.to;

        ". Javićemo ti 30 i 10 minuta ranije."

    if (koliko > 0 && !state.savetVidjen) {

      "Prevoznik: ASP „Strela“ Obrenovac. Red vožnje važi od 01.09.2026, sa izmenama " +
      "na linijama 1, 2 i 6 od 06.10.2026. Vremena su planirana i mogu da odstupaju od " +
      "stvarnih dolazaka. Call centar: "));
    var a = el("a", null, "022/311-617");
    a.href = "tel:+38122311617";
    foot.appendChild(a);
    root.appendChild(foot);
  }

  /**
   * Kratko objašnjenje podsetnika. Stoji dok korisnik ne napravi prvi podsetnik
   * ili ne zatvori savet, pa se više ne pojavljuje.
   */
  function renderSavet() {
    if (!MOST || state.savetVidjen) return;

    var box = el("div", "savet");

    var ikona = el("span", "savet-ikona");
    ikona.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="M12 3a6 6 0 0 0-6 6c0 3-1.2 4.3-1.8 5-.4.4-.1 1 .4 1h14.8c.5 0 .8-.6.4-1-.6-.7-1.8-2-1.8-5a6 6 0 0 0-6-6z" ' +
      'stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>' +
      '<path d="M10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    box.appendChild(ikona);

    var tekst = el("div", "savet-tekst");
    tekst.appendChild(el("strong", null, "Podsetnik na polazak"));
    tekst.appendChild(el("p", null,
      "Dodirni bilo koje vreme polaska i javićemo ti 30 i 10 minuta pre nego što " +
      "autobus krene. Obaveštenje stiže i kada je aplikacija zatvorena."));
    tekst.appendChild(el("p", null,
      "Uključeni podsetnik ima tačkicu u uglu. Dodirni isto vreme ponovo da ga isključiš."));
    box.appendChild(tekst);

    var x = el("button", "savet-zatvori", "×");
    x.setAttribute("aria-label", "Zatvori objašnjenje");
    x.onclick = function () {
      state.savetVidjen = true;
      save();
      render();
    };
    box.appendChild(x);

    root.appendChild(box);
  }

  /** Polje sa vremenom polaska; u aplikaciji je dugme koje pali podsetnik. */
  function polje(line, dir, m, cls, tekst, tag) {
    var idx = Math.min(state.stopIdx, dir.stops.length - 1);
    var id = podsetnikId(line, dir, state.day, idx, m);
    var ima = MOST && imaPodsetnik(id);
    if (ima) cls += " podsetnik";

    if (!MOST) return el(tag || "div", cls, tekst);

    var b = el("button", cls, tekst);
    b.setAttribute("aria-label",
      (ima ? "Isključi podsetnik za " : "Uključi podsetnik za ") + fmt(m));
    b.setAttribute("aria-pressed", ima ? "true" : "false");
    b.onclick = function () {
      state.poruka = null;
      prebaciPodsetnik(line, dir, state.day, idx, m);
    };
    return b;
  }

  function renderNext(line, departures, nextPos, isToday, nowMin, dayDef) {
    var box = el("div", "next");
    if (!departures.length) {
      box.appendChild(el("p", "msg", "Sa ovog stajališta nema polazaka " + dayDef.word + "."));
    } else if (!isToday) {
      box.appendChild(el("p", "msg small", "Prikazan je red vožnje za drugi dan, pa nema odbrojavanja."));
    } else if (nextPos === -1) {
      box.appendChild(el("p", "msg",
        "Danas više nema polazaka. Prvi sledećeg dana: " + fmt(departures[0].m)));
    } else {
      var wrap = el("div");
      var big = el("span", "big", fmt(departures[nextPos].m));
      big.style.color = line.color;
      var mins = departures[nextPos].m - nowMin;
      wrap.appendChild(big);
      wrap.appendChild(el("span", "in", mins === 0 ? "kreće sada" : "za " + mins + " min"));
      box.appendChild(wrap);
    }
    root.appendChild(box);

    if (!departures.length) return;

    renderSavet();

    var start = (state.showAll || nextPos < 1) ? 0 : nextPos - 1;
    var dir = currentDir(line);
    var grid = el("div", "grid");
    departures.slice(start).forEach(function (d, k) {
      var pos = start + k;
      var cls = "slot";
      if (pos === nextPos) cls += " next";
      else if (isToday && nextPos !== -1 && pos < nextPos) cls += " past";
      var s = polje(line, dir, d.m, cls, fmt(d.m));
      if (pos === nextPos) s.style.background = line.color;
      grid.appendChild(s);
    });
    root.appendChild(grid);

    if (start > 0) {
      var b = el("button", "link-btn", "Prikaži i ranije polaske (" + start + ")");
      b.onclick = function () { state.showAll = true; render(); };
      root.appendChild(b);
    }
  }

  function renderDay(line, departures, nextPos, isToday, dayDef) {
    if (!departures.length) {
      var p = el("p", "msg");
      p.style.padding = "18px 20px 0";
      p.textContent = "Sa ovog stajališta nema polazaka " + dayDef.word + ".";
      root.appendChild(p);
      return;
    }
    renderSavet();

    var hours = [];
    departures.forEach(function (d) {
      var h = Math.floor(d.m / 60);
      if (hours.indexOf(h) === -1) hours.push(h);
    });

    var box = el("div", "hours");
    hours.forEach(function (h) {
      var row = el("div", "hour-row");
      var key = el("div", "hour-key", pad2(h));
      key.style.color = line.color;
      row.appendChild(key);
      var mins = el("div", "mins");
      departures.forEach(function (d, pos) {
        if (Math.floor(d.m / 60) !== h) return;
        var cls = "min";
        if (pos === nextPos) cls += " next";
        else if (isToday && nextPos !== -1 && pos < nextPos) cls += " past";
        var s = polje(line, currentDir(line), d.m, cls, pad2(d.m % 60), "span");
        if (pos === nextPos) s.style.background = line.color;
        mins.appendChild(s);
      });
      row.appendChild(mins);
      box.appendChild(row);
    });
    root.appendChild(box);
  }

  function renderPodsetnici() {
    if (!MOST) return;

    if (state.poruka) {
      var p = el("p", "poruka", state.poruka);
      root.appendChild(p);
    }

    // Upozorenje ako sistem ne dozvoljava alarme u tačno vreme
    var tacno = true;
    try { tacno = MOST.tacniAlarmi(); } catch (e) { }
    if (!tacno && state.podsetnici.length) {
      var w = el("div", "upozorenje");
      w.appendChild(el("span", null,
        "Obaveštenja mogu da kasne nekoliko minuta jer aplikaciji nije dozvoljeno " +
        "zakazivanje u tačno vreme."));
      var dug = el("button", "link-ugradjen", "Dozvoli");
      dug.onclick = function () { MOST.otvoriPodesavanjaAlarma(); };
      w.appendChild(dug);
      root.appendChild(w);
    }

    if (!state.podsetnici.length) return;

    var box = el("section", "podsetnici");
    box.appendChild(el("h3", null, "Podsetnici"));

    var lista = state.podsetnici.slice().sort(function (a, b) {
      return a.polazak - b.polazak;
    });

    lista.forEach(function (r) {
      var red = el("div", "podsetnik-red");
      var t = new Date(r.polazak);

      var levo = el("div", "pod-levo");
      levo.appendChild(el("span", "pod-vreme",
        pad2(t.getHours()) + ":" + pad2(t.getMinutes())));
      levo.appendChild(el("span", "pod-opis",
        r.naslov + " · " + r.stajaliste + " · " + opisDatuma(t)));
      red.appendChild(levo);

      var x = el("button", "pod-otkazi", "×");
      x.setAttribute("aria-label", "Otkaži podsetnik");
      x.onclick = function () {
        MOST.otkazi(r.id);
        state.poruka = null;
        state.podsetnici = ucitajPodsetnike();
        render();
      };
      red.appendChild(x);
      box.appendChild(red);
    });

    box.appendChild(el("p", "pod-nota",
      "Obaveštenje stiže 30 i 10 minuta pre polaska. Podsetnik važi za prvi sledeći " +
      "put kada taj polazak kreće i posle toga se sam briše."));
    root.appendChild(box);
  }

  function renderTable(line, dir, trips, departures, nextPos, dayDef) {
    if (!trips.length) {
      var p = el("p", "msg");
      p.style.padding = "18px 20px 0";
      p.textContent = "Ova linija ne saobraća " + dayDef.word + ".";
      root.appendChild(p);
      return;
    }
    var activeTrip = nextPos !== -1 && departures[nextPos] ? departures[nextPos].ti : -1;

    var scroll = el("div", "table-scroll");
    var table = el("table");
    var tbody = el("tbody");

    dir.stops.forEach(function (st, i) {
      var tr = el("tr");
      var isEnd = i === 0 || i === dir.stops.length - 1;
      var th = el("th", "stop" + (isEnd ? " end" : ""), st);
      th.setAttribute("scope", "row");
      tr.appendChild(th);
      trips.forEach(function (t, ti) {
        var m = timeAt(t, dir, i);
        var td = el("td", m === null ? "skip" : (ti === activeTrip ? "now" : ""), m === null ? "–" : fmt(m));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    scroll.appendChild(table);
    root.appendChild(scroll);
    root.appendChild(el("p", "hint",
      "Tabela se pomera levo-desno. Crtica znači da polazak ne dodiruje to stajalište."));
  }

  /* ---------- pokretanje ---------- */

  state.podsetnici = ucitajPodsetnike();
  render();

  // Kad korisnik odgovori na pitanje o dozvoli, nastavljamo tamo gde smo stali.
  window.addEventListener("prevoz-dozvola", function (e) {
    var c = state.cekaDozvolu;
    state.cekaDozvolu = null;
    if (!e.detail) {
      state.poruka = "Bez dozvole za obaveštenja podsetnici ne mogu da rade.";
      render();
      return;
    }
    if (!c) { render(); return; }
    var l = LINES.filter(function (x) { return x.id === c.line; })[0];
    if (!l) { render(); return; }
    var d = l.dirs.filter(function (x) { return x.key === c.dir; })[0] || l.dirs[0];
    prebaciPodsetnik(l, d, c.day, c.idx, c.m);
  });

  // Osveži tek kad se promeni minut, i ne dok korisnik čita tabelu,
  // da se prikaz ne pomera pod prstima.
  var lastMin = new Date().getMinutes();
  setInterval(function () {
    var m = new Date().getMinutes();
    if (m === lastMin) return;
    lastMin = m;
    if (state.view === "tabela") return;
    render();
  }, 10000);

  // Povratak u prvi plan: dan je možda prešao u sledeći.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    state.day = dayKeyFor(new Date().getDay());
    state.showAll = false;
    state.poruka = null;
    state.podsetnici = ucitajPodsetnike();
    lastMin = new Date().getMinutes();
    render();
  });

})();
</script>
</body>
</html>
